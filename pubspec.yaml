name: voice_note_app
description: "A Flutter music learning app with synchronized pitch visualization and microphone analysis."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  pointer_interceptor: ^0.10.1+3
  provider: ^6.1.5+1
  record: ^7.1.1
  shared_preferences: ^2.5.6
  typed_data: ^1.4.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pitches/
